name: a11y
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - name: Serve static build
        run: |
          npx http-server storybook-static -p 6006 --silent &
          until curl -s http://localhost:6006 > /dev/null 2>&1; do
            sleep 1
          done
      - name: Run a11y tests
        run: npx test-storybook --url http://localhost:6006 --testTimeout 30000
        env:
          BRAND: ECE
