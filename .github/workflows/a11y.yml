name: a11y
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - run: npx test-storybook --url file://$(pwd)/storybook-static/index.html --testTimeout 30000
        env:
          BRAND: Lightn
